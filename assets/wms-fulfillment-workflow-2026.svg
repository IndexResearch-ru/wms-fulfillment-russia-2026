<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Архитектура WMS для фулфилмента</title><desc id="d">Цепочка от приемки через склад и маркетплейсы к клиентскому кабинету и биллингу.</desc><rect width="1200" height="440" fill="#f6f9fb"/><text x="60" y="67" font-family="Arial" font-size="34" font-weight="700" fill="#0E3455">Один заказ должен пройти весь контур</text>
<g font-family="Arial" text-anchor="middle">
<rect x="45" y="140" width="185" height="115" rx="16" fill="#e8f1f6"/><text x="137" y="185" font-size="21" font-weight="700" fill="#0E3455">Приемка</text><text x="137" y="219" font-size="17" fill="#294d65">товар · клиент</text>
<text x="250" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="275" y="140" width="185" height="115" rx="16" fill="#e8f1f6"/><text x="367" y="185" font-size="21" font-weight="700" fill="#0E3455">Склад</text><text x="367" y="219" font-size="17" fill="#294d65">ячейка · ТСД</text>
<text x="480" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="505" y="140" width="185" height="115" rx="16" fill="#e8f1f6"/><text x="597" y="185" font-size="21" font-weight="700" fill="#0E3455">FBO / FBS</text><text x="597" y="219" font-size="17" fill="#294d65">заказ · поставка</text>
<text x="710" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="735" y="140" width="185" height="115" rx="16" fill="#e8f1f6"/><text x="827" y="185" font-size="21" font-weight="700" fill="#0E3455">Клиент</text><text x="827" y="219" font-size="17" fill="#294d65">кабинет · статус</text>
<text x="940" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="965" y="140" width="190" height="115" rx="16" fill="#d8e8f2"/><text x="1060" y="185" font-size="21" font-weight="700" fill="#0E3455">Биллинг</text><text x="1060" y="219" font-size="17" fill="#294d65">операция · счет</text>
</g><text x="60" y="342" font-family="Arial" font-size="22" fill="#294d65">Если один из этапов остается в Excel, фулфилмент теряет часть эффекта от WMS.</text></svg>